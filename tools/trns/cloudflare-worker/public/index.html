<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14111c" />
  <meta name="color-scheme" content="dark" />
  <title>trns — translator</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="hero">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">trns</span>
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-sub">translator</span>
      </div>
      <p class="tagline">Tap to translate. Swipe to swap. Free, in your pocket.</p>
    </header>

    <section class="lang-row" aria-label="Languages">
      <button id="srcBtn" class="lang-pill" type="button" aria-haspopup="listbox">
        <span class="lang-code" id="srcCode">EN</span>
        <span class="lang-name" id="srcName">English</span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>

      <button id="swapBtn" class="swap" type="button" title="Swap languages" aria-label="Swap languages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3 1.4-1.4L21.8 8l-5.4 5.4L15 12l3-3H7V7zm10 10H6l3 3-1.4 1.4L2.2 16l5.4-5.4L9 12l-3 3h11v2z"/></svg>
      </button>

      <button id="tgtBtn" class="lang-pill" type="button" aria-haspopup="listbox">
        <span class="lang-code" id="tgtCode">PL</span>
        <span class="lang-name" id="tgtName">Polish</span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
    </section>

    <section class="card card-source">
      <div class="card-head">
        <span class="card-label" id="srcLabel">English</span>
        <button id="srcClear" class="ghost" type="button" aria-label="Clear source">Clear</button>
      </div>
      <textarea
        id="srcText"
        rows="3"
        maxlength="4500"
        placeholder="Type something to translate…"
        autocapitalize="sentences"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <div class="card-foot">
        <span id="charCount" class="muted">0 / 4500</span>
      </div>
    </section>

    <button id="translateBtn" class="primary" type="button">
      <span class="primary-label">Translate</span>
      <span class="primary-spinner" aria-hidden="true"></span>
    </button>

    <section class="card card-target" aria-live="polite">
      <div class="card-head">
        <span class="card-label" id="tgtLabel">Polish</span>
        <button id="copyBtn" class="ghost" type="button" aria-label="Copy translation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
          <span id="copyLabel">Copy</span>
        </button>
      </div>
      <div id="tgtText" class="result" data-empty="true">Your translation will appear here.</div>
      <div class="card-foot">
        <span id="detectLabel" class="muted"></span>
      </div>
    </section>

    <section id="history" class="history" hidden>
      <header class="history-head">
        <h2>Recent</h2>
        <button id="clearHistory" class="ghost" type="button">Clear</button>
      </header>
      <ul id="historyList" class="history-list"></ul>
    </section>

    <footer class="foot">
      <span>trns v0.1.0 · <a href="https://github.com/Inpriv/labs/tree/main/tools/trns" target="_blank" rel="noopener">Inpriv Labs</a></span>
    </footer>
  </main>

  <!-- Language picker sheet -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="document">
      <header class="sheet-head">
        <h2 id="sheetTitle">Choose language</h2>
        <button class="ghost" type="button" data-close aria-label="Close">Close</button>
      </header>
      <input id="sheetSearch" class="sheet-search" type="search" placeholder="Search…" autocomplete="off" />
      <ul id="sheetList" class="sheet-list" role="listbox"></ul>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
