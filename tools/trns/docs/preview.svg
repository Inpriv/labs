<text x="335.2" y="82" fill="#271e4c" font-weight="700" xml:space="preserve"> EN ⇄ PL </text>
<text x="37.6" y="102" fill="#948f99" xml:space="preserve">────────────────────────────────────────</text>
<text x="37.6" y="202" fill="#948f99" xml:space="preserve">EN</text>
<text x="76.0" y="202" fill="#948f99" xml:space="preserve">▎</text>
<text x="95.2" y="202" fill="#cbc4d4" xml:space="preserve">Good morning, how are you?</text>
<text x="37.6" y="222" fill="#cbbeff" font-weight="700" xml:space="preserve">PL</text>
<text x="76.0" y="222" fill="#cbbeff" xml:space="preserve">▎</text>
<text x="95.2" y="222" fill="#e8e4ee" font-weight="700" xml:space="preserve">Dzień dobry, jak się masz?</text>
<text x="37.6" y="262" fill="#948f99" xml:space="preserve">EN</text>
<text x="76.0" y="262" fill="#948f99" xml:space="preserve">▎</text>
<text x="95.2" y="262" fill="#cbc4d4" xml:space="preserve">Where is the train station?</text>
<text x="37.6" y="282" fill="#cbbeff" font-weight="700" xml:space="preserve">PL</text>
<text x="76.0" y="282" fill="#cbbeff" xml:space="preserve">▎</text>
<text x="95.2" y="282" fill="#e8e4ee" font-weight="700" xml:space="preserve">Gdzie jest dworzec kolejowy?</text>
<text x="37.6" y="322" fill="#948f99" xml:space="preserve">PL</text>
<text x="76.0" y="322" fill="#948f99" xml:space="preserve">▎</text>
<text x="95.2" y="322" fill="#cbc4d4" xml:space="preserve">Dziękuję za pomoc!</text>
<text x="37.6" y="342" fill="#cbbeff" font-weight="700" xml:space="preserve">EN</text>
<text x="76.0" y="342" fill="#cbbeff" xml:space="preserve">▎</text>
<text x="95.2" y="342" fill="#e8e4ee" font-weight="700" xml:space="preserve">Thank you for your help!</text>
<text x="37.6" y="362" fill="#948f99" xml:space="preserve">────────────────────────────────────────</text>
